name: Android Release (signed AAB + sideload APK)

# Signed Android builds, made on a runner so the Windows dev machine needs no
# Flutter/Android/JDK toolchain. Manual for the same reason as
# ios-release.yml: a release is a decision, not a side effect of a push.
#
# Two outputs from one run, both signed with the upload key:
#   - an .aab artifact to upload in the Play Console by hand. Play App Signing
#     re-signs it with the key Google holds; the key here is only the *upload*
#     key, so losing it is recoverable through Play support.
#   - a sideload .apk (for testing on a TV or phone), built with
#     DAWN_SIDELOAD=true and published as GitHub Release `b<build>`, which is
#     what the in-app update check reads. The AAB never gets that flag: Play
#     forbids updating outside the store.
#
# REQUIRED SECRETS (repo → Settings → Secrets and variables → Actions):
#   ANDROID_UPLOAD_KEYSTORE   base64 of the upload keystore (.jks / PKCS12)
#   ANDROID_KEYSTORE_PASSWORD the keystore password
#   ANDROID_KEY_PASSWORD      the key password (same as the store password for PKCS12)
#   ANDROID_KEY_ALIAS         the key alias (upload)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'versionCode + release tag b<N>. Must be higher than any bundle on Play and any existing b<N> release.'
        required: true
      publish_release:
        description: 'Publish the APK as GitHub Release b<N> (sideloaded installs will be offered it)'
        type: boolean
        required: false
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # create the b<N> release

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pin = the locally installed version; bump both together.
          flutter-version: '3.44.8'
          cache: true

      - run: flutter --version

      - run: flutter pub get

      # build.gradle.kts quietly falls back to debug signing when
      # key.properties is missing, which Play rejects only after the upload.
      # Fail here instead if any secret is absent.
      - name: Write signing config
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for v in KEYSTORE STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!v}" ]; then echo "::error::Missing signing secret for $v"; exit 1; fi
          done
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<PROPS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          PROPS

      # DAWN_COMMIT surfaces in Settings → About & credits, so any build on a
      # device can be traced back to an exact revision.
      - name: Build signed AAB
        run: |
          flutter build appbundle --release \
            --build-number="${{ inputs.build_number }}" \
            --dart-define=DAWN_COMMIT=${GITHUB_SHA::7}

      # A separate build because the update check must exist only here.
      # Universal (all ABIs in one file) so it installs on any TV as-is.
      - name: Build sideload APK
        run: |
          flutter build apk --release \
            --build-number="${{ inputs.build_number }}" \
            --dart-define=DAWN_COMMIT=${GITHUB_SHA::7} \
            --dart-define=DAWN_SIDELOAD=true
          mkdir -p build/dist
          APK="build/dist/dawnplayer-${GITHUB_SHA::7}-b${{ inputs.build_number }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          cp build/app/outputs/bundle/release/app-release.aab \
            "build/dist/dawnplayer-${GITHUB_SHA::7}-b${{ inputs.build_number }}.aab"
          echo "APK=$APK" >> "$GITHUB_ENV"

      # Print the signers so a debug-signed build is obvious in the log, and
      # fail outright if either is one.
      - name: Verify signatures
        run: |
          for F in build/dist/*; do
            echo "== $(basename "$F") ($(du -h "$F" | cut -f1))"
            SIGNER="$(keytool -printcert -jarfile "$F")"
            echo "$SIGNER"
            if [ -z "$SIGNER" ] || echo "$SIGNER" | grep -q "CN=Android Debug"; then
              echo "::error::$(basename "$F") is unsigned or debug-signed"; exit 1
            fi
          done

      - uses: actions/upload-artifact@v5
        with:
          name: dawnplayer-android-${{ inputs.build_number }}
          path: build/dist/
          if-no-files-found: error

      # Tag format b<N> is what UpdateService matches. Fails rather than
      # overwrites if that release already exists.
      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "b${{ inputs.build_number }}" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Build ${{ inputs.build_number }} (${GITHUB_SHA::7})" \
            --generate-notes

      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" android/key.properties
