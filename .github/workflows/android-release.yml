name: Android Release (signed AAB → Play)

# Signed Play Store bundle, built on a runner so the Windows dev machine needs
# no Flutter/Android/JDK toolchain. Manual for the same reason as
# ios-release.yml: a release is a decision, not a side effect of a push.
#
# The output is an .aab artifact to upload in the Play Console by hand. Play App
# Signing re-signs it with the app signing key Google holds; the key here is
# only the *upload* key, so losing it is recoverable through Play support.
#
# REQUIRED SECRETS (repo → Settings → Secrets and variables → Actions):
#   ANDROID_UPLOAD_KEYSTORE   base64 of the upload keystore (.jks / PKCS12)
#   ANDROID_KEYSTORE_PASSWORD the keystore password
#   ANDROID_KEY_PASSWORD      the key password (same as the store password for PKCS12)
#   ANDROID_KEY_ALIAS         the key alias (upload)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'versionCode. Must be higher than any bundle already uploaded to Play.'
        required: true
        default: '1'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pin = the locally installed version; bump both together.
          flutter-version: '3.44.8'
          cache: true

      - run: flutter --version

      - run: flutter pub get

      # build.gradle.kts quietly falls back to debug signing when
      # key.properties is missing, which Play rejects only after the upload.
      # Fail here instead if any secret is absent.
      - name: Write signing config
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for v in KEYSTORE STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!v}" ]; then echo "::error::Missing signing secret for $v"; exit 1; fi
          done
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<PROPS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          PROPS

      # DAWN_COMMIT surfaces in Settings → About & credits, so any build on a
      # device can be traced back to an exact revision.
      - name: Build signed AAB
        run: |
          flutter build appbundle --release \
            --build-number="${{ inputs.build_number }}" \
            --dart-define=DAWN_COMMIT=${GITHUB_SHA::7}

      # Print the signer so a debug-signed bundle is obvious in the log, and
      # fail outright if it is one.
      - name: Verify signature
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          echo "Size: $(du -h "$AAB" | cut -f1)"
          SIGNER="$(keytool -printcert -jarfile "$AAB")"
          echo "$SIGNER"
          if echo "$SIGNER" | grep -q "CN=Android Debug"; then
            echo "::error::Bundle is debug-signed"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dawnplayer-android-${{ inputs.build_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" android/key.properties
