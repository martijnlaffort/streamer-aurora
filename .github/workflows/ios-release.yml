name: iOS Release (signed → TestFlight)

# Signed App Store builds, run entirely on the macOS runner because development
# happens on Windows and there is no Mac in the loop.
#
# Deliberately manual: a release is a decision, not a side effect of a push.
# ios-unsigned.yml still builds an unsigned IPA on every push to main for
# sideloading — that one is the day-to-day artifact; this one goes to Apple.
#
# REQUIRED SECRETS (repo → Settings → Secrets and variables → Actions):
#   IOS_DIST_CERT_P12        base64 of the Apple Distribution .p12
#   IOS_DIST_CERT_PASSWORD   the password set when exporting that .p12
#   IOS_PROVISIONING_PROFILE base64 of the App Store .mobileprovision
#   IOS_TEAM_ID              10-character Apple team id
#   ASC_KEY_ID               App Store Connect API key id
#   ASC_ISSUER_ID            App Store Connect API issuer id
#   ASC_KEY_P8               base64 of the AuthKey_XXXXXXXX.p8
#
# All seven can be produced from Windows — see docs/store-listing.md §4.4. The
# App Store Connect API key is used rather than an Apple ID + app-specific
# password because it does not break when the password changes and needs no 2FA.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'CFBundleVersion. Must be higher than any build already uploaded for this version.'
        required: true
        default: '1'
      submit_to_testflight:
        description: 'Upload to TestFlight (uncheck to only produce a signed IPA artifact)'
        type: boolean
        required: false
        default: true

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pin = the locally installed version; bump both together.
          flutter-version: '3.44.8'
          cache: true

      - run: flutter --version

      # Re-assert ATS, the 13.0 deployment target, the bundle identifier and the
      # export-compliance key. Idempotent, and cheap insurance against a
      # regenerated iOS scaffold quietly reverting the store identity.
      - name: Assert iOS config
        run: bash tool/patch_ios.sh

      - run: flutter pub get

      # A dedicated keychain, unlocked for the length of the job, rather than
      # the login keychain: it keeps the private key out of any shared state and
      # is thrown away with the runner. `set-key-partition-list` is what stops
      # codesign blocking on an interactive "allow access?" prompt.
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" \
            -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          rm -f "$RUNNER_TEMP/dist.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Prepend to the search list so xcodebuild finds it, keeping the
          # system keychain available for root certificates.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"

          echo "Identities available to codesign:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install provisioning profile
        env:
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          # Xcode 16 reads profiles from this path; the older
          # ~/Library/MobileDevice/Provisioning\ Profiles is still honoured, so
          # write both and let whichever the toolchain prefers win.
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                     "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            echo "$PROFILE" | base64 --decode > "$dir/dawnplayer.mobileprovision"
          done

          # Echo the profile's identity so a mismatched profile is obvious in
          # the log rather than surfacing as an opaque codesign failure.
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/dawnplayer.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"
          echo "Profile name: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          echo "Profile UUID: $(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          echo "Expires:      $(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist")"
          echo "PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")" >> "$GITHUB_ENV"

      - name: Write ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.dawnplayer.app</key>
              <string>${PROFILE_UUID}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          echo "--- ExportOptions.plist ---"
          cat "$RUNNER_TEMP/ExportOptions.plist"

      # DAWN_COMMIT surfaces in Settings → About & credits, so any build on a
      # device can be traced back to an exact revision.
      - name: Build signed IPA
        run: |
          flutter build ipa --release \
            --build-number="${{ inputs.build_number }}" \
            --dart-define=DAWN_COMMIT=${GITHUB_SHA::7} \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Show what was built
        run: |
          ls -la build/ios/ipa/
          IPA="$(find build/ios/ipa -name '*.ipa' -print -quit)"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "Size: $(du -h "$IPA" | cut -f1)"

      # Keep the exact uploaded artifact retrievable — when a TestFlight build
      # misbehaves, the first question is what was actually in it.
      - uses: actions/upload-artifact@v4
        with:
          name: dawnplayer-ios-signed
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        if: ${{ inputs.submit_to_testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # altool looks for the key by convention in one of a few fixed
          # directories, named AuthKey_<id>.p8 — it takes the id, not a path.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          # Validate first: it catches the cheap rejections (bad Info.plist
          # keys, missing icon, wrong bundle id) in seconds, before spending
          # minutes on the upload.
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Clean up keychain
        if: always()
        run: |
          security default-keychain -s login.keychain-db 2>/dev/null || true
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
