name: iOS Unsigned Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pin = the locally installed version; bump both together.
          flutter-version: '3.44.8'
          cache: true

      - run: flutter --version

      # The ios/ scaffold is committed. Re-assert ATS + the 13.0 deployment
      # target anyway — idempotent insurance against scaffold regeneration.
      - name: Assert iOS config (ATS + deployment target)
        run: bash tool/patch_ios.sh

      - run: flutter pub get

      # Compile without code signing. `pod install` runs automatically.
      # NOTE: `flutter build ipa --no-codesign` does NOT emit an .ipa (it needs
      # a team id), so we build the .app and package the IPA manually below.
      # AURORA_COMMIT surfaces in Settings → About & credits, so a device can
      # always be traced back to an exact revision. Injected here rather than
      # passed by hand, because the one time it is forgotten is the build whose
      # identity someone needs.
      - name: Build (unsigned, stamped with the commit)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=AURORA_COMMIT=${GITHUB_SHA::7}

      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -R Runner.app Payload/Runner.app
          zip -r app-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ipa
          path: build/ios/iphoneos/app-unsigned.ipa
          if-no-files-found: error
