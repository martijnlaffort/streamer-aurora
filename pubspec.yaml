name: dawnplayer
description: Dawn Player — a cinematic IPTV player for Xtream and M3U sources.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^3.3.2

  # Routing
  go_router: ^17.3.0

  # Playback (libmpv) — versions validated on-device by the smoke test
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # Data
  dio: ^5.10.0
  drift: ^2.34.2
  drift_flutter: ^0.3.1 # official drift runtime libs (sqlite3_flutter_libs is EOL)
  path_provider: ^2.1.6
  flutter_secure_storage: ^10.3.1
  xml: ^7.0.1 # XMLTV EPG parsing (PRD §8.5)

  # UI
  cached_network_image: ^3.4.1
  screen_brightness: ^2.1.11 # player brightness gesture
  linked_scroll_controller: ^0.2.0 # synced horizontal scroll in the EPG grid

  # Models
  crypto: ^3.0.6 # stable account ids (sha256 of the playlist identity)
  equatable: ^2.1.0
  meta: ^1.18.0 # @visibleForTesting in flutter-free data layer
  audio_session: ^0.2.4
  package_info_plus: ^10.2.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Latest drift_dev/build_runner conflict with riverpod 3.x / flutter_test
  # meta pins on Flutter 3.44.8 — let pub solve within these ranges.
  drift_dev: ^2.34.0
  build_runner: '>=2.13.0 <2.15.2'
  flutter_launcher_icons: ^0.14.4 # generates the app icon; run: dart run flutter_launcher_icons

# App icon generation (source: assets/icon/dawn_icon.png).
flutter_launcher_icons:
  image_path: "assets/icon/dawn_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # Matches the icon tile, so the adaptive icon has no seam around the art.
  adaptive_icon_background: "#151A24"
  adaptive_icon_foreground: "assets/icon/dawn_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/dawn_icon.png"

flutter:
  uses-material-design: true
  assets:
    # Award canon for the offline discovery rails (see canon_source.dart).
    - assets/canon/canon.json
    # OFL 1.1 requires the licence to travel with the fonts below. Registered
    # with LicenseRegistry in main.dart so it shows in the licence page.
    - assets/licenses/OFL-Inter.txt
    - assets/licenses/OFL-Outfit.txt

  # Typefaces are BUNDLED, not fetched. The google_fonts package downloads from
  # fonts.gstatic.com on first launch, which meant the app made a third-party
  # network call it did not need, had to disclose it in the privacy policy, and
  # rendered a fallback face on a cold start with no connection.
  #
  # These are the static instances Google serves for each weight — real
  # per-weight files, not a variable font, because Flutter maps fontWeight to a
  # declared `weight:` and does NOT interpolate a variable axis from it.
  #
  # Only the weights actually asked for are here (see AppTypography). Anything
  # else — the w800 on the ranked-poster numerals, for instance — snaps to the
  # nearest of these and is synthetically emboldened, exactly as it was before.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
