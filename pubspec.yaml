name: aurora
description: Aurora — a cinematic IPTV player for Xtream and M3U sources.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^3.3.2

  # Routing
  go_router: ^17.3.0

  # Playback (libmpv) — versions validated on-device by the smoke test
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # Data
  dio: ^5.10.0
  drift: ^2.34.2
  drift_flutter: ^0.3.1 # official drift runtime libs (sqlite3_flutter_libs is EOL)
  path_provider: ^2.1.6
  flutter_secure_storage: ^10.3.1
  xml: ^7.0.1 # XMLTV EPG parsing (PRD §8.5)

  # UI
  cached_network_image: ^3.4.1
  screen_brightness: ^2.1.11 # player brightness gesture
  linked_scroll_controller: ^0.2.0 # synced horizontal scroll in the EPG grid
  google_fonts: ^8.2.0 # display + UI typefaces (PRD §10)

  # Models
  equatable: ^2.1.0
  meta: ^1.18.0 # @visibleForTesting in flutter-free data layer
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Latest drift_dev/build_runner conflict with riverpod 3.x / flutter_test
  # meta pins on Flutter 3.44.8 — let pub solve within these ranges.
  drift_dev: ^2.34.0
  build_runner: '>=2.13.0 <2.15.2'
  flutter_launcher_icons: ^0.14.4 # generates the app icon; run: dart run flutter_launcher_icons

# App icon generation (source: assets/icon/aurora_icon.png).
flutter_launcher_icons:
  image_path: "assets/icon/aurora_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0B0D12"
  adaptive_icon_foreground: "assets/icon/aurora_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/aurora_icon.png"

flutter:
  uses-material-design: true
