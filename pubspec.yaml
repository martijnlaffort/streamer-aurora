name: aurora
description: Aurora — a cinematic IPTV player for Xtream and M3U sources.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^3.3.2

  # Routing
  go_router: ^17.3.0

  # Playback (libmpv) — versions validated on-device by the smoke test
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # Data
  dio: ^5.10.0
  drift: ^2.34.2
  drift_flutter: ^0.3.1 # official drift runtime libs (sqlite3_flutter_libs is EOL)
  path_provider: ^2.1.6
  flutter_secure_storage: ^10.3.1

  # UI
  cached_network_image: ^3.4.1

  # Models
  equatable: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # drift_dev + build_runner arrive with the schema in Task 0.4

flutter:
  uses-material-design: true
