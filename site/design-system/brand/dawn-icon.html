<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Dawn — app icon export</title>
<!--
  Generator for the 1024×1024 app icon. Render this page at exactly 1024×1024
  and screenshot it:

    chrome-headless-shell --headless --window-size=1024,1024 \
      --screenshot=dawn-icon-1024.png file:///…/dawn-icon.html

  Full-bleed square on purpose — iOS applies its own squircle mask and Android
  crops to whatever shape the launcher uses, so shipping pre-rounded corners
  would show as a dark halo inside the mask.
-->
<style>
  html,body{margin:0;padding:0;width:1024px;height:1024px;overflow:hidden;background:#151A24}
  svg{display:block;width:1024px;height:1024px}
</style>
<svg viewBox="0 0 64 64" role="img" aria-label="Dawn app icon">
  <defs>
    <linearGradient id="g" x1="32" y1="26" x2="32" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B6BFF"/><stop offset=".48" stop-color="#FF7A9C"/><stop offset="1" stop-color="#FFC46B"/>
    </linearGradient>
    <linearGradient id="h" x1="8" y1="0" x2="56" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC46B" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFC46B" stop-opacity=".92"/>
      <stop offset="1" stop-color="#FFC46B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sky" cx="32" cy="43" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9A7A" stop-opacity=".20"/>
      <stop offset="1" stop-color="#FF9A7A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="above"><rect x="0" y="0" width="64" height="42.5"/></clipPath>
  </defs>

  <!-- canvas: a touch of vertical lift so the icon has depth on a home screen -->
  <rect width="64" height="64" fill="#151A24"/>
  <rect width="64" height="64" fill="url(#sky)"/>

  <!-- the art, scaled up slightly for icon presence -->
  <g transform="translate(32 36.5) scale(1.16) translate(-32 -36.5)">
    <g clip-path="url(#above)"><circle cx="32" cy="47.5" r="19.5" fill="url(#g)"/></g>
    <path d="M27.3 30.9 38.7 36.4 27.3 41.9z" fill="#151A24"/>
    <path d="M9 42.5h46" stroke="url(#h)" stroke-width="2" stroke-linecap="round"/>
    <path d="M18.5 48.4h10.5M35 48.4h10.5" stroke="url(#h)" stroke-width="1.4" stroke-linecap="round" opacity=".42"/>
  </g>
</svg>
